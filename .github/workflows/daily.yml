name: Daily AI Digest

on:
  schedule:
    # 08:00 UTC = 16:00 北京时间 (CST, UTC+8)
    # GitHub Actions 的定时任务在高峰期会延迟，甚至直接丢弃，所以排 3 个时间点做冗余；
    # collect.py 发现当天日报已存在会自己跳过，多跑不会重复。
    - cron: "0 8 * * *"    # 16:00 CST（主）
    - cron: "30 9 * * *"   # 17:30 CST（备 1）
    - cron: "0 12 * * *"   # 20:00 CST（备 2，避开 UTC 整点高峰）
  workflow_dispatch:
    inputs:
      force:
        description: "强制重跑（忽略当天已有日报）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: daily-ai-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and summarize
        env:
          # 手动触发时强制重跑；定时触发时幂等跳过已生成的当天日报
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # 在仓库 Settings → Secrets and variables → Actions 里配置
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 默认 GITHUB_TOKEN 已可用，用来提高 GitHub API 配额
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py

      - name: Build weekly digest
        run: python scripts/build_weekly.py

      - name: Build site
        env:
          # 对外地址（Cloudflare Pages 自定义域名）；换域名改这里或设仓库变量
          SITE_URL: ${{ vars.SITE_URL || 'https://aivulcan.de5.net' }}
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest weekly state site README.md
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
            exit 0
          fi
          git commit -m "chore(digest): $(TZ=Asia/Shanghai date +%F) AI 前沿日报"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push 失败，$i 秒后重试…"
            sleep $((i * 5))
          done
