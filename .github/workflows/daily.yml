name: Daily AI Digest

on:
  schedule:
    # 08:00 UTC = 16:00 北京时间 (CST, UTC+8)
    # 注意：GitHub Actions 的定时任务在高峰期可能延迟 5~30 分钟，属正常现象。
    - cron: "0 8 * * *"
  workflow_dispatch: {}   # 支持手动触发，方便调试

permissions:
  contents: write

concurrency:
  group: daily-ai-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and summarize
        env:
          # 在仓库 Settings → Secrets and variables → Actions 里配置
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 默认 GITHUB_TOKEN 已可用，用来提高 GitHub API 配额
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py

      - name: Build site
        env:
          # 换成 Cloudflare Pages 的实际地址后同步改这里
          SITE_URL: ${{ vars.SITE_URL || 'https://ai-daily-digest.pages.dev' }}
        run: python scripts/build_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest state site README.md
          if git diff --cached --quiet; then
            echo "没有新内容，跳过提交"
            exit 0
          fi
          git commit -m "chore(digest): $(TZ=Asia/Shanghai date +%F) AI 前沿日报"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && break
            echo "push 失败，$i 秒后重试…"
            sleep $((i * 5))
          done
